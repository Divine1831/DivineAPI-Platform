<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <title>Reset Password | DivineAPI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b0f19;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid #26334b;
      border-radius: 18px;
      background: #151d30;
    }

    h1 { margin-top: 0; }
    p { color: #aab7ca; line-height: 1.6; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #0b0f19;
      border: 1px solid #334155;
    }

    button {
      border: 0;
      background: #38bdf8;
      color: #082032;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    a { color: #38bdf8; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Enter your new DivineAPI account password below.</p>

    <form id="resetForm" hidden>
      <input
        id="password"
        type="password"
        placeholder="New password"
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        Update password
      </button>
    </form>

    <p id="message" role="status">Checking your reset link...</p>
    <p><a href="/">Return to DivineAPI</a></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://xutkvhczlcfubfqsrvek.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_XUwted0G3TCYiYDPuS4cTQ_GfyuLxvO";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    async function prepareSession() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );

      if (code) {
        const { error } =
          await supabase.auth.exchangeCodeForSession(code);

        if (error) throw error;

        window.history.replaceState(
          {},
          "",
          window.location.pathname
        );
      } else if (
        hash.get("access_token") &&
        hash.get("refresh_token")
      ) {
        const { error } = await supabase.auth.setSession({
          access_token: hash.get("access_token"),
          refresh_token: hash.get("refresh_token")
        });

        if (error) throw error;

        window.history.replaceState(
          {},
          "",
          window.location.pathname
        );
      } else {
        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "Your reset link is missing or expired. Request a new one."
          );
        }
      }
    }

    try {
      await prepareSession();

      message.textContent =
        "Reset link verified. Choose your new password.";

      form.hidden = false;
    } catch (error) {
      message.textContent = error.message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Your password must be at least 8 characters.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Updating password...";

      const { error } =
        await supabase.auth.updateUser({ password });

      button.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Password updated successfully. You can now sign in.";

      form.reset();
      form.hidden = true;
    });
  </script>
</body>
</html>
